name: validate-observability
on:
  push:
    paths:
      - "prom/**"
      - "grafana/**"
      - "python/api/**"
      - "docs/**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          # jq + prometheus (여기에 promtool 포함됨)
          sudo apt-get install -y jq prometheus

          # Python 패키지 설치 (requirements.txt 에 fastapi 포함했다고 가정)
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Prometheus config check
        run: promtool check config prom/prometheus.yml

      - name: Prometheus rules check
        run: promtool check rules prom/alert_rules.yml

      - name: Grafana dashboard JSON lint
        run: jq . grafana/dashboards/netauto-health.json >/dev/null

      - name: Metrics contract check (static snapshot)
        run: |
          python3 python/api/metrics.py --snapshot
          grep -q '^netauto_status ' docs/metrics.txt
          grep -q '^netauto_drift_config ' docs/metrics.txt
          grep -q 'netauto_neighbors{state="full"}' docs/metrics.txt
          grep -q '^netauto_routes_total ' docs/metrics.txt
          grep -q 'netauto_tests_count{type="failed"}' docs/metrics.txt

