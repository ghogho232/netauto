services:
  netauto-api:
    image: python:3.12
    working_dir: /app
    volumes: [".:/app"]
    environment: ["PYTHONPATH=/app"]
    command: bash -lc "pip install fastapi uvicorn && uvicorn python.api.health:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prom/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prom/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    depends_on: [netauto-api, alertmanager]

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./prom/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    secrets:
      - slack_webhook_url
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/data:/var/lib/grafana
      - ./secrets/certs:/certs:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/certs/grafana.crt
      - GF_SERVER_CERT_KEY=/certs/grafana.key
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://192.168.159.100:3000
      - GF_SERVER_DOMAIN=192.168.159.100
      - GF_SERVER_ENFORCE_DOMAIN=true
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_DATABASE_TYPE=sqlite3
    depends_on: [prometheus]

  nginx-redirect:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/redirect.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [grafana]
secrets:
  slack_webhook_url:
    file: ./secrets/slack_webhook_url

