global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: "netauto-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["netauto-api:8000"]
        labels:
          env: "dev"
          topo: "ospf-mini"
# trigger validate-observability
